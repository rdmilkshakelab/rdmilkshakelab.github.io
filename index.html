<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to My Website</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* Splash screen overlay */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        /* The Enter Button */
        .enter-btn {
            padding: 15px 40px;
            font-size: 20px;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,123,255,0.4);
        }

        .enter-btn:hover {
            background-color: #0056b3;
        }

        /* Fullscreen Video Container */
        #video-container {
            display: none; /* Hidden until button is clicked */
            width: 100vw;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }

        iframe {
            width: 100vw;
            height: 56.25vw; 
            min-height: 100vh;
            min-width: 177.77vh; 
            border: none;
        }
    </style>
</head>
<body>

    <!-- Splash screen that blocks the video initially -->
    <div id="overlay">
        <button class="enter-btn" onclick="startVideo()">Enter Site</button>
    </div>

    <!-- Container for the video embed -->
    <div id="video-container">
        <div id="player"></div>
    </div>

    <!-- Load the official YouTube Player API -->
    <script src="https://youtube.com"></script>

    <script>
        let player;

        // This function creates the YouTube embed automatically
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'dQw4w9WgXcQ', // Never Gonna Give You Up
                playerVars: {
                    'controls': 0,    // Hide YouTube controls
                    'rel': 0,         // Don't show related videos
                    'loop': 1,        // Loop the video
                    'playlist': 'dQw4w9WgXcQ' // Required for looping
                }
            });
        }

        // Runs when the user clicks the "Enter Site" button
        function startVideo() {
            // Hide the splash overlay
            document.getElementById('overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('overlay').style.display = 'none';
            }, 500);

            // Show the video container
            document.getElementById('video-container').style.display = 'flex';

            // Play the video out loud (unmuted)
            if (player && typeof player.playVideo === 'function') {
                player.unMute();
                player.playVideo();
            }
        }
    </script>

</body>
</html>
