<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfie Catlow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #fff;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            margin-bottom: 50px;
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .clock-box {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 40px;
            text-align: center;
        }

        .clock-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        #time {
            font-family: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, "Courier New", monospace;
            font-size: 28px;
            font-weight: 600;
            color: #000;
            letter-spacing: 1px;
        }

        h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .project {
            margin-bottom: 30px;
        }

        .project h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .project p {
            color: #666;
            margin-bottom: 12px;
        }

        .project-link {
            display: inline-block;
            color: #0066cc;
            text-decoration: none;
            font-size: 14px;
        }

        .project-link:hover {
            text-decoration: underline;
        }

        .tag {
            display: inline-block;
            background: #f0f0f0;
            color: #333;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-top: 8px;
        }

        footer {
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid #ddd;
            color: #666;
            font-size: 14px;
        }

        footer a {
            color: #0066cc;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Alfie Catlow</h1>
            <p class="subtitle">Developer based in London</p>
        </header>

        <div class="clock-box">
            <div class="clock-label">The time where I live is:</div>
            <div id="time">--:--:--</div>
        </div>

        <section>
            <h2>Projects</h2>
            <div class="project">
                <h3>Incident Tracker</h3>
                <p>A simple tracker for days without incidents. Built for TV screens with a focus on clarity and usability.</p>
                <span class="tag">HTML</span>
                <br>
                <a href="https://github.com/rdmilkshakelab/incident-tracker" class="project-link">View on GitHub →</a>
            </div>
        </section>

        <footer>
            <p>Find me on <a href="https://github.com/rdmilkshakelab">GitHub</a></p>
        </footer>
    </div>

    <script>
        const londonTimeFormatter = new Intl.DateTimeFormat('en-GB', {
            timeZone: 'Europe/London',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false
        });

        function updateClock() {
            document.getElementById('time').textContent = londonTimeFormatter.format(new Date());
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
