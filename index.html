<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: sans-serif;
            overflow: hidden;
        }

        /* Splash screen overlay */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        /* The Enter Button */
        .enter-btn {
            padding: 15px 40px;
            font-size: 20px;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,123,255,0.4);
        }

        .enter-btn:hover {
            background-color: #0056b3;
        }

        /* Fixed Video Wrapper to force full screen layout */
        #video-container {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Completely stretches the iframe securely */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Splash screen -->
    <div id="overlay">
        <button class="enter-btn" onclick="startVideo()">Enter Site</button>
    </div>

    <!-- Container for the video embed -->
    <div id="video-container">
        <iframe id="rickroll" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <script>
        function startVideo() {
            // 1. Hide overlay
            document.getElementById('overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('overlay').style.display = 'none';
            }, 500);

            // 2. Show container
            document.getElementById('video-container').style.display = 'block';

            // 3. Inject the source with optimized screen-stretching parameters
            document.getElementById('rickroll').src = "https://youtube.com";
        }
    </script>

</body>
</html>
